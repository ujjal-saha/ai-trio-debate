<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triple AI Split</title>
<style>
  :root {
    --bg: #15171c;
    --surface: #1d2027;
    --line: #2b303a;
    --text: #e8eaef;
    --muted: #8f97a6;
    --ok: #4cc38a;
    --busy: #e2b84a;
    --bad: #f0715f;
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0;
    width: 760px;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 var(--font);
  }
  main { padding: 14px 16px 16px; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.1px; }
  .tools { display: flex; gap: 8px; }

  button {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: #4a5262; }
  button:disabled { color: var(--muted); cursor: default; opacity: 0.6; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid #7aa2ff;
    outline-offset: 2px;
  }
  button.primary { background: #e8eaef; color: #15171c; border-color: #e8eaef; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #fff; }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }

  textarea, select {
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  textarea { width: 100%; height: 78px; resize: vertical; padding: 9px 11px; }
  select { padding: 4px 8px; }

  .opt {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: -4px 0 10px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }
  .opt input { margin: 0; }

  .send-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0 14px;
    color: var(--muted);
    font-size: 12px;
  }

  /* debate setup */
  #debatepanel { margin-bottom: 14px; }
  #debatepanel label.title { display: block; font-weight: 600; margin-bottom: 6px; }
  .debate-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .debate-row .grow { flex: 1; }
  .debate-row label { display: flex; align-items: center; gap: 6px; color: var(--text); }
  #debateerror { margin-top: 8px; color: var(--bad); font-size: 12px; }

  /* debate progress */
  #debatebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  #debatebar .info { min-width: 0; }
  #debatetext { font-weight: 600; }
  #debatetopic {
    color: var(--muted);
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #debatebar .actions { display: flex; gap: 8px; flex: none; }

  #cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .col {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--line);
    border-top: 3px solid var(--accent);
    border-radius: 6px;
    min-width: 0;
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  .head label { display: flex; align-items: center; gap: 7px; font-weight: 600; cursor: pointer; }
  .head input { accent-color: var(--accent); margin: 0; }

  .state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .state[data-state="sending"]::before, .state[data-state="waiting"]::before, .state[data-state="replying"]::before { background: var(--busy); }
  .state[data-state="done"]::before { background: var(--ok); }
  .state[data-state="error"]::before { background: var(--bad); }

  .body {
    height: 250px;
    overflow-y: auto;
    padding: 10px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .body.empty { color: var(--muted); }
  .body.error { color: var(--bad); }

  .foot { padding: 8px 10px; border-top: 1px solid var(--line); }
  .foot button { padding: 4px 10px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Triple AI Split</h1>
    <div class="tools">
      <button id="debate">Debate</button>
      <button id="launch">Open 3 windows</button>
      <button id="newchats">New chats</button>
    </div>
  </header>

  <label class="opt" title="A covered window is slowed down by Chrome, and ChatGPT or Gemini may then not show their reply until the window is visible.">
    <input type="checkbox" id="autoraise" checked>
    If a window is hidden and stuck, bring it to the front
  </label>

  <!-- normal chat -->
  <div id="chat">
    <textarea id="prompt" placeholder="Type one prompt for all three…" spellcheck="true"></textarea>
    <div class="send-row">
      <span>Ctrl+Enter sends. Untick a column to skip that AI.</span>
      <button id="send" class="primary">Send to all</button>
    </div>
  </div>

  <!-- debate setup -->
  <section id="debatepanel" hidden>
    <label class="title" for="topic">What should the three AIs debate?</label>
    <textarea id="topic" placeholder="Your idea or topic, for example: Should a small shop build its own app or use an existing platform?" spellcheck="true"></textarea>
    <div class="debate-row">
      <label>Back-and-forth rounds
        <select id="rounds">
          <option>1</option><option>2</option><option selected>3</option>
          <option>4</option><option>5</option><option>6</option>
        </select>
      </label>
      <span class="grow">Each AI then gives a final conclusion.</span>
      <button id="canceldebate">Cancel</button>
      <button id="startdebate" class="primary">Start debate</button>
    </div>
    <div id="debateerror"></div>
  </section>

  <!-- debate progress -->
  <div id="debatebar" hidden>
    <div class="info">
      <div id="debatetext"></div>
      <div id="debatetopic"></div>
    </div>
    <div class="actions">
      <button id="copylog">Copy full debate</button>
      <button id="retrydebate" class="primary" hidden>Retry</button>
      <button id="stopdebate" class="danger">Stop</button>
      <button id="closedebate">Close</button>
    </div>
  </div>

  <div id="cols"></div>
</main>

<script src="config.js"></script>
<script src="debate.js"></script>
<script src="popup.js"></script>
</body>
</html>
